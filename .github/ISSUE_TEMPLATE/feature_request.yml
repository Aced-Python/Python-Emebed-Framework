name: Feature request
description: Propose a new frame API or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the real bot-building task this would help with, not just the API shape.
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API (if you have one in mind)
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today without this?
      description: e.g. raw discord.py, a workaround, a different library.
  - type: checkboxes
    id: philosophy-check
    attributes:
      label: Design philosophy check
      description: See the README's "Design philosophy" section.
      options:
        - label: This doesn't require frame to invent Discord functionality that doesn't exist
        - label: This can be opt-in (doesn't change behavior for existing simple calls)
