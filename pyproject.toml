[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "discord-frame"
version = "0.1.0"
description = "A developer-experience layer for beautiful Discord embeds and Components V2 interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frame contributors" }]
keywords = ["discord", "discord.py", "embeds", "components", "ui", "components-v2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["discord.py>=2.6,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Documentation = "https://example.com/frame/docs"
Repository = "https://github.com/example/frame"
Issues = "https://github.com/example/frame/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["frame"]
branch = true
