name: Bug report
description: Something isn't working the way frame's docs say it should
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `frame.embed(...)` / `frame.ui...` call that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full traceback/error message if there is one.
    validations:
      required: true
  - type: input
    id: frame-version
    attributes:
      label: frame version
      description: Output of `python -c "import frame; print(frame.__version__)"`
    validations:
      required: true
  - type: input
    id: discordpy-version
    attributes:
      label: discord.py version
      description: Output of `python -c "import discord; print(discord.__version__)"`
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true
