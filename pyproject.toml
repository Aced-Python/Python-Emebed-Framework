[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frame-discord"
version = "0.1.0"
description = "A developer-experience layer for building beautiful Discord embeds and Components V2 interfaces on top of discord.py."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frame contributors" }]
keywords = ["discord", "discord.py", "embed", "components", "ui", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["discord.py>=2.7.1"]

[project.urls]
Homepage = "https://github.com/frame-discord/frame"
Documentation = "https://github.com/frame-discord/frame#readme"
Repository = "https://github.com/frame-discord/frame"
Issues = "https://github.com/frame-discord/frame/issues"
Changelog = "https://github.com/frame-discord/frame/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frame"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
